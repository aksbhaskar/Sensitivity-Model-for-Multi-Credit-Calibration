[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetload"
version = "0.1.0"
description = "Firm-specific common-jump loadings for multi-credit calibration with elastically stopped Lévy processes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Akshat Bhaskar" },
  { name = "Ishaan Harish" },
  { name = "Saksham Arora" },
]
keywords = ["credit risk", "levy processes", "wiener-hopf", "monte carlo", "cdo", "cdx", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter", "matplotlib"]

[project.urls]
Repository = "https://github.com/aksbhaskar/sensitivity-model-for-multi-credit-calibration"
"Original paper" = "https://arxiv.org/abs/2608.10321"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
